services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      # El servicio db (imagen oficial de Postgres) necesita POSTGRES_*,
      # los mapeamos desde las mismas variables que usa tu settings.py
      # para no duplicar nombres en el .env.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PSWD}
    volumes:
      # Desde Postgres 18, la imagen oficial espera el volumen en
      # /var/lib/postgresql (no en .../data como en versiones anteriores).
      - pgdata:/var/lib/postgresql
      # Crea el esquema "trackerdb" la primera vez que se inicializa el volumen
      # (tu settings.py usa search_path=trackerdb, y por defecto Postgres
      # solo trae el esquema "public").
      - ./docker/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    # Sobreescribimos el CMD de producción del Dockerfile por runserver,
    # que sí recarga en caliente cuando cambias código (útil en desarrollo).
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/app/src
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: